name: Release

# Build the signed + notarized macOS app and the Windows app, and publish the
# artifacts (+ electron-updater metadata) to a GitHub Release for this version.
#
# Trigger by pushing a tag like `v0.1.0`, or run manually (Actions → Release → Run).
# electron-builder publishes to a DRAFT release named after the version; review and
# publish it so the auto-updater (which only sees published releases) can find it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # allow GITHUB_TOKEN to create/upload the release

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # GitHub's release CDN intermittently 504s while electron's postinstall
      # downloads its prebuilt binary, which fails the whole job. Retry npm ci a
      # few times so a transient gateway timeout doesn't sink the release.
      - name: Install dependencies (retry on transient network errors)
        run: |
          ok=
          for i in 1 2 3 4 5; do
            if npm ci; then ok=1; break; fi
            echo "::warning::npm ci failed (attempt $i/5) — retrying in 30s"
            rm -rf node_modules
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::npm ci failed after 5 attempts"; exit 1; }
      - name: Decode signing certificate (.p12) and API key (.p8)
        run: |
          # APPLE_CERTIFICATE must be a base64-encoded Developer ID Application
          # .p12 (certificate + private key). APPLE_API_KEY is the App Store
          # Connect .p8 used for notarization only — a different credential.
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          if ! file -b "$RUNNER_TEMP/cert.p12" | grep -qiE 'data|DER|PKCS'; then
            echo "::error::APPLE_CERTIFICATE is not a binary .p12. Export the 'Developer ID Application' certificate (with its private key) from Keychain Access as a .p12 and store its base64 in APPLE_CERTIFICATE. (A .p8 is the notarization API key, not a signing certificate.)"
            echo "decoded type: $(file -b "$RUNNER_TEMP/cert.p12")"
            exit 1
          fi
          echo "CSC_LINK=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign & notarize (macOS)
        env:
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization via App Store Connect API key (APPLE_API_KEY path set above).
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm run build
          # Build artifacts only — publishing is a separate, retried step below
          # because electron-builder's own uploader does not retry GitHub's
          # intermittent 504s and 422s on already-existing assets.
          # electron-builder also downloads the electron binary from GitHub —
          # retry it too so a transient 504 mid-build doesn't fail the job.
          bash ./scripts/retry.sh npx electron-builder --mac --publish never
      - name: Publish to GitHub release (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/publish-release.sh

  windows:
    # Run after macOS so only one job publishes first: electron-builder creates
    # the GitHub release if it's missing, and parallel jobs would each create a
    # separate draft for the same tag (splitting mac/win assets + the two
    # electron-updater yml files across two releases). Serializing lets Windows
    # find the existing draft and upload into it.
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # GitHub's release CDN intermittently 504s while electron's postinstall
      # downloads its prebuilt binary, which fails the whole job. Retry npm ci a
      # few times so a transient gateway timeout doesn't sink the release.
      - name: Install dependencies (retry on transient network errors)
        shell: bash # the retry loop is bash; the Windows runner defaults to pwsh
        run: |
          ok=
          for i in 1 2 3 4 5; do
            if npm ci; then ok=1; break; fi
            echo "::warning::npm ci failed (attempt $i/5) — retrying in 30s"
            rm -rf node_modules
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::npm ci failed after 5 attempts"; exit 1; }
      - name: Build (Windows)
        shell: bash
        run: |
          npm run build
          bash ./scripts/retry.sh npx electron-builder --win --publish never
      - name: Publish to GitHub release (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/publish-release.sh

  linux:
    # Run after Windows for the same single-draft reason (see the windows job):
    # serializing lets this job upload its AppImage + latest-linux.yml into the
    # existing draft instead of racing to create a second one.
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # GitHub's release CDN intermittently 504s while electron's postinstall
      # downloads its prebuilt binary, which fails the whole job. Retry npm ci a
      # few times so a transient gateway timeout doesn't sink the release.
      - name: Install dependencies (retry on transient network errors)
        run: |
          ok=
          for i in 1 2 3 4 5; do
            if npm ci; then ok=1; break; fi
            echo "::warning::npm ci failed (attempt $i/5) — retrying in 30s"
            rm -rf node_modules
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::npm ci failed after 5 attempts"; exit 1; }
      - name: Build (Linux)
        run: |
          npm run build
          bash ./scripts/retry.sh npx electron-builder --linux --publish never
      - name: Publish to GitHub release (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/publish-release.sh
