name: Release

# Build the signed + notarized macOS app and the Windows app, and publish the
# artifacts (+ electron-updater metadata) to a GitHub Release for this version.
#
# Trigger by pushing a tag like `v0.1.0`, or run manually (Actions → Release → Run).
# electron-builder publishes to a DRAFT release named after the version; review and
# publish it so the auto-updater (which only sees published releases) can find it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # allow GITHUB_TOKEN to create/upload the release

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Decode App Store Connect API key (.p8)
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize & publish (macOS)
        env:
          # Developer ID Application certificate (base64-encoded .p12) + its password.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization via App Store Connect API key (APPLE_API_KEY path set above).
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --mac --publish always

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build & publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --win --publish always
